name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emergency:
        description: "Emergency deploy: proceed even if tests fail"
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -v
  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || inputs.emergency) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying appinv ${GITHUB_SHA::7} to production"
