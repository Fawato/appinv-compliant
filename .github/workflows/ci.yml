name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: test-results.xml}
  input-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Invalid inputs are rejected or flagged
        run: pytest -v tests/test_validation.py --junitxml=input-validation-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: input-validation-results, path: input-validation-results.xml}
